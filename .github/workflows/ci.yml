name: VRM Studio Verification CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: npm ci

      - name: TypeScript typecheck
        run: npm run lint

      - name: Build frontend and server
        run: npm run build

      - name: Check committed server bundle is fresh
        run: |
          git diff --exit-code -- dist-server/server.cjs || { echo "dist-server/server.cjs is stale: run 'npm run build:server' and commit it"; exit 1; }

      - name: Run TypeScript VRM pipeline & conformance tests
        run: npm test

      - name: Run Python VRM validator & Blender runner tests
        run: npm run test:backend
